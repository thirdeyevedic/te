<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Third Eye — Gautam GS, founder of Third Eye Events">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1813"/>
      <stop offset="44%" stop-color="#121010"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f1e8" stop-opacity="0.26"/>
      <stop offset="52%" stop-color="#e8d9b4" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#b89b5e" stop-opacity="0.01"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f0e2c2" stop-opacity="0.26"/>
      <stop offset="42%" stop-color="#b89b5e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b89b5e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="iris" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#f2e4c4" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#c9a84a" stop-opacity="0.72"/>
      <stop offset="78%" stop-color="#a9552b" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6e5a3e" stop-opacity="0.30"/>
    </radialGradient>

    <radialGradient id="floorglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b89b5e" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#a9552b" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#a9552b" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="irisblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- ambient halo -->
  <ellipse cx="400" cy="394" rx="340" ry="320" fill="url(#halo)"/>

  <!-- spotlight cone -->
  <polygon points="400,40 610,900 190,900" fill="url(#beam)" filter="url(#soft)"/>

  <!-- aura rings -->
  <g fill="none" stroke="#b89b5e">
    <circle cx="400" cy="462" r="150" stroke-opacity="0.26" stroke-width="1"/>
    <circle cx="400" cy="462" r="236" stroke-opacity="0.16" stroke-width="0.7" stroke-dasharray="3 12"/>
    <circle cx="400" cy="462" r="322" stroke-opacity="0.10" stroke-width="0.6" stroke-dasharray="1 17"/>
  </g>

  <!-- radiating light -->
  <g stroke-linecap="round">
    <line x1="400.0" y1="242.0" x2="400.0" y2="188.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="429.2" y1="258.6" x2="436.5" y2="217.2" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="457.5" y1="266.1" x2="471.8" y2="226.7" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="491.0" y1="266.4" x2="518.0" y2="219.6" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="508.0" y1="295.3" x2="535.0" y2="263.1" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="528.7" y1="316.0" x2="560.9" y2="289.0" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="557.6" y1="333.0" x2="604.4" y2="306.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="557.9" y1="366.5" x2="597.3" y2="352.2" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="565.4" y1="394.8" x2="606.8" y2="387.5" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="582.0" y1="424.0" x2="636.0" y2="424.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="565.4" y1="453.2" x2="606.8" y2="460.5" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="557.9" y1="481.5" x2="597.3" y2="495.8" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="557.6" y1="515.0" x2="604.4" y2="542.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="528.7" y1="532.0" x2="560.9" y2="559.0" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="508.0" y1="552.7" x2="535.0" y2="584.9" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="491.0" y1="581.6" x2="518.0" y2="628.4" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="457.5" y1="581.9" x2="471.8" y2="621.3" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="429.2" y1="589.4" x2="436.5" y2="630.8" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="400.0" y1="606.0" x2="400.0" y2="660.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="370.8" y1="589.4" x2="363.5" y2="630.8" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="342.5" y1="581.9" x2="328.2" y2="621.3" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="309.0" y1="581.6" x2="282.0" y2="628.4" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="292.0" y1="552.7" x2="265.0" y2="584.9" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="271.3" y1="532.0" x2="239.1" y2="559.0" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="242.4" y1="515.0" x2="195.6" y2="542.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="242.1" y1="481.5" x2="202.7" y2="495.8" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="234.6" y1="453.2" x2="193.2" y2="460.5" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="218.0" y1="424.0" x2="164.0" y2="424.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="234.6" y1="394.8" x2="193.2" y2="387.5" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="242.1" y1="366.5" x2="202.7" y2="352.2" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="242.4" y1="333.0" x2="195.6" y2="306.0" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="271.3" y1="316.0" x2="239.1" y2="289.0" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="292.0" y1="295.3" x2="265.0" y2="263.1" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
    <line x1="309.0" y1="266.4" x2="282.0" y2="219.6" stroke="#b89b5e" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="342.5" y1="266.1" x2="328.2" y2="226.7" stroke="#b89b5e" stroke-opacity="0.3" stroke-width="0.9"/>
    <line x1="370.8" y1="258.6" x2="363.5" y2="217.2" stroke="#b89b5e" stroke-opacity="0.16" stroke-width="0.9"/>
  </g>

  <!-- the third eye -->
  <g>
    <!-- soft bloom behind the eye -->
    <ellipse cx="400" cy="462" rx="150" ry="104" fill="#b89b5e" opacity="0.16" filter="url(#soft)"/>

    <!-- almond aperture -->
    <path d="M 250 424 C 322 320, 478 320, 550 424
             C 478 528, 322 528, 250 424 Z"
          fill="#0b0a09" stroke="#b89b5e" stroke-opacity="0.62" stroke-width="1.6"/>

    <!-- iris -->
    <circle cx="400" cy="462" r="66" fill="url(#iris)" filter="url(#irisblur)"/>
    <circle cx="400" cy="462" r="66" fill="none" stroke="#e6d3a4" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="400" cy="462" r="25" fill="#070707"/>
    <circle cx="400" cy="462" r="25" fill="none" stroke="#b89b5e" stroke-opacity="0.45" stroke-width="1"/>
    <!-- catchlight -->
    <circle cx="380" cy="402" r="9" fill="#f5f1e8" opacity="0.5"/>

    <!-- lids -->
    <path d="M 250 424 C 322 320, 478 320, 550 424"
          fill="none" stroke="#e6d3a4" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- tilak: the vertical mark below the eye -->
  <g stroke="#b89b5e" stroke-linecap="round">
    <line x1="400" y1="552" x2="400" y2="638" stroke-opacity="0.42" stroke-width="1.4"/>
    <path d="M 400 638 l 9 15 l -9 15 l -9 -15 Z" fill="#b89b5e" fill-opacity="0.42" stroke="none"/>
  </g>

  <!-- stage floor -->
  <ellipse cx="400" cy="884" rx="268" ry="30" fill="url(#floorglow)"/>
  <line x1="146" y1="884" x2="654" y2="884" stroke="#b89b5e" stroke-opacity="0.2" stroke-width="1"/>

  <!-- signature -->
  <line x1="300" y1="930" x2="500" y2="930" stroke="#b89b5e" stroke-opacity="0.5" stroke-width="1"/>
  <text x="400" y="964" text-anchor="middle" fill="#b89b5e" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" letter-spacing="7.5" opacity="0.88">GAUTAM GS</text>
  <text x="400" y="990" text-anchor="middle" fill="#8a8580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="10" letter-spacing="4.2" opacity="0.72">DIRECTOR · CHOREOGRAPHER · DESIGNER · VISIONARY</text>

  <!-- grain -->
  <rect width="800" height="1000" filter="url(#grain)" opacity="0.05"/>
</svg>
